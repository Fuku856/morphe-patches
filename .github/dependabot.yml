version: 2
updates:
  - package-ecosystem: github-actions
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: npm
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # 6.2 requires compileSdk 37, and the extensions compile against 36.
      - dependency-name: org.lsposed.hiddenapibypass:hiddenapibypass
        versions: [">= 6.2"]
